server:
  port: ${APPLICATION_PORT:7777}

grpc:
  server:
    port: ${GRPC_PORT:9090}

spring:
  application:
    name: application

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

    show-sql: false

  threads:
    virtual:
      enabled: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  data:
    redis:
      port: 6379

auth:
  tokens:
    max-sessions: 4
    access-token:
      lifetime: 5m
    refresh-token:
      lifetime: 30d

    verification-common: &verification-common
      lifetime: 5m

    verification-token:
      <<: *verification-common

    verification-code:
      <<: *verification-common
      max-attempts: 3