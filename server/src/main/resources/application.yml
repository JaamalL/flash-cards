server:
  port: ${APPLICATION_PORT:7777}

spring:
  application:
    name: application

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

  main:
    allow-bean-definition-overriding: true

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

    show-sql: false

  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 15000
      leak-detection-threshold: 10000
      pool-name: HikariPool

  data:
    redis:
      port: 6379

auth:
  tokens:
    max-sessions: 4
    access-token:
      lifetime: 30m
    refresh-token:
      lifetime: 30d

    verification-common: &verification-common
      lifetime: 5m

    verification-token:
      <<: *verification-common

    verification-code:
      <<: *verification-common
      max-attempts: 3