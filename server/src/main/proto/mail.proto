syntax = "proto3";

package mail;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.techpassport.grpc.mail";
option java_outer_classname = "MailerSenderProto";

service MailSender {
  rpc SendMail(Request) returns (google.protobuf.Empty);
}

message Request {
  string email = 1;
  string subject = 2;
  string content = 3;
}
